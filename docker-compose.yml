version: '3.8'

services:
  # InfluxDB v2 database
  influxdb:
    image: docker.io/influxdb:2.7
    container_name: hyundai-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-changeme123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-hyundai}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-vehicle_data}
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-changeme-token-12345}
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hyundai Logger application
  hyundai-logger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyundai-logger
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      # Hyundai API credentials
      HYUNDAI_USERNAME: ${HYUNDAI_USERNAME}
      HYUNDAI_PASSWORD: ${HYUNDAI_PASSWORD}
      HYUNDAI_PIN: ${HYUNDAI_PIN}
      HYUNDAI_BRAND: ${HYUNDAI_BRAND:-hyundai}
      HYUNDAI_REGION: ${HYUNDAI_REGION:-US}

      # InfluxDB connection
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-changeme-token-12345}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-hyundai}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-vehicle_data}

      # Rate limiting
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-5}
      REQUESTS_PER_HOUR: ${REQUESTS_PER_HOUR:-12}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs

  # Optional: Grafana for visualization
  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: hyundai-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-worldmap-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
