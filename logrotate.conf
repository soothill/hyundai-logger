# Logrotate configuration for Hyundai Logger
# Install to: /etc/logrotate.d/hyundai-logger

/var/log/hyundai-logger/*.log {
    # Rotate daily
    daily

    # Keep 30 days worth of backlogs
    rotate 30

    # Compress old logs
    compress
    delaycompress

    # Don't error if log file is missing
    missingok

    # Don't rotate if log file is empty
    notifempty

    # Create new log file with these permissions
    create 0644 hyundai-logger hyundai-logger

    # Use date as extension instead of numbers
    dateext
    dateformat -%Y%m%d

    # Run postrotate script after rotation
    postrotate
        # Signal the application to reopen log files (if needed)
        # For now, the application will continue writing to the old file descriptor
        # which is fine with most logging implementations
        systemctl reload-or-restart hyundai-logger.service > /dev/null 2>&1 || true
    endscript

    # Max size before forcing rotation regardless of time
    maxsize 100M

    # Shared scripts - run postrotate once after all logs are rotated
    sharedscripts
}
