# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

version: 2

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters-settings:
  staticcheck:
    # Exclude QF1008 (simplification suggestions) globally
    # We have a false positive in coalesce.go where VehicleCoalescer
    # intentionally uses vc.Coalescer.requests because it has its own
    # 'mu' field that would shadow the embedded Coalescer's mutex
    checks: ["all", "-QF1008"]

issues:
  # Don't hide multiple issues
  max-issues-per-linter: 0
  max-same-issues: 0
