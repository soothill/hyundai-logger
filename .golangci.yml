# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - stylecheck

issues:
  exclude-rules:
    # Exclude the false positive in coalesce.go
    # VehicleCoalescer intentionally uses vc.Coalescer.requests because
    # it has its own 'mu' field that would shadow the embedded Coalescer's mutex
    - path: internal/coalesce/coalesce.go
      linters:
        - staticcheck
      text: "could remove embedded field"

  # Don't hide multiple issues
  max-issues-per-linter: 0
  max-same-issues: 0

linters-settings:
  errcheck:
    # Report errors from type assertions: `a := b.(MyStruct)`
    check-type-assertions: true
    # Report errors from blank assignments: `num, _ := strconv.Atoi(value)`
    check-blank: false

  govet:
    check-shadowing: false  # We already fixed variable shadowing issues

  staticcheck:
    # https://staticcheck.io/docs/options#checks
    checks: ["all"]

  stylecheck:
    # https://staticcheck.io/docs/options#checks
    checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]

  revive:
    confidence: 0.8
