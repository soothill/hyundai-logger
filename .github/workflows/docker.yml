name: Docker Build and Publish

on:
  # Only run after CI workflow completes successfully
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ main ]
  # Also allow manual trigger
  workflow_dispatch:
  # Run on version tags
  push:
    tags: [ 'v*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Only run if CI succeeded (for workflow_run) OR manual/tag trigger
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Check CI workflow result
        if: github.event_name == 'workflow_run'
        run: |
          echo "CI workflow completed with status: ${{ github.event.workflow_run.conclusion }}"
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ CI workflow did not succeed. Docker build cancelled."
            exit 1
          fi
          echo "✅ CI workflow succeeded. Proceeding with Docker build."

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # For workflow_run, checkout the commit that triggered CI
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Show build context
        run: |
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "Building from CI workflow trigger"
            echo "Commit SHA: ${{ github.event.workflow_run.head_sha }}"
            echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          else
            echo "Building from direct trigger"
            echo "Ref: ${{ github.ref }}"
            echo "SHA: ${{ github.sha }}"
          fi
          git log -1 --oneline

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.event.workflow_run.head_branch }},enable=${{ github.event_name == 'workflow_run' }}
            type=sha,prefix=${{ github.event.workflow_run.head_branch }}-,enable=${{ github.event_name == 'workflow_run' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Scan image for vulnerabilities
        # Only scan if we pushed the image
        if: steps.build.outputs.digest != ''
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Fix SARIF format issues
        if: steps.build.outputs.digest != ''
        run: |
          # Install jq if not present
          sudo apt-get update && sudo apt-get install -y jq
          # Fix malformed SARIF output if present
          if [ -f trivy-results.sarif ]; then
            # Use jq to ensure proper SARIF format
            jq '(.runs[].results[]?.fixes[]?.artifactChanges | select(. != null and type != "array")) |= [.]' trivy-results.sarif > trivy-results-fixed.sarif || cp trivy-results.sarif trivy-results-fixed.sarif
            mv trivy-results-fixed.sarif trivy-results.sarif
          fi

      - name: Upload Trivy results
        if: steps.build.outputs.digest != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
