name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.24'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.txt
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build main binary
        run: go build -v -o hyundai-logger ./cmd/hyundai-logger

      - name: Build export tool
        run: go build -v -o export-data ./cmd/export-data

      - name: Build interactive CLI
        run: go build -v -o hyundai-logger-interactive ./cmd/hyundai-logger-interactive

      - name: Build validation tool
        run: go build -v -o validate-config ./cmd/validate-config

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: binaries
          path: |
            hyundai-logger
            export-data
            hyundai-logger-interactive
            validate-config

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'

      - name: Fix SARIF format issues
        if: always()
        run: |
          # Fix malformed artifactChanges in Gosec SARIF output
          if [ -f results.sarif ]; then
            # Use jq to fix the artifactChanges field - ensure it's always an array
            jq '(.runs[].results[]?.fixes[]?.artifactChanges | select(. != null and type != "array")) |= [.]' results.sarif > results-fixed.sarif || cp results.sarif results-fixed.sarif
            mv results-fixed.sarif results.sarif
          fi

      - name: Upload SARIF file
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
